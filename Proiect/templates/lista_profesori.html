{% extends "base.html" %}
{% block title %}Lista Profesori{% endblock %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>👨‍🏫 Lista Profesori</h1>
        <a href="{{ url_for('adauga_profesor') }}" class="btn btn-success">➕ Adaugă Profesor</a>
    </div>
    
    <table>
        <thead><tr><th>Nume Profesor</th></tr></thead>
        <tbody>
            {% for prof in profesori %}
            <tr><td>{{ prof.get_full_name() }}</td></tr>
            {% else %}
            <tr><td style="text-align: center; color: gray;">Nu există profesori.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
