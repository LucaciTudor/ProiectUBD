{% extends "base.html" %}
{% block title %}Autentificare{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; text-align: center;">
    <h1 style="color: #333; border: none;">🔐 Autentificare</h1>
    <p style="color: gray;">Folosește contul creat sau admin/admin123</p>
    
    <form method="POST" style="background: #f8f9fa; padding: 30px; border-radius: 8px; border: 1px solid #ddd; text-align: left;">
        <label>Username sau Email:</label>
        <input type="text" name="username" required class="form-control" placeholder="ex: admin">
        
        <label>Parolă:</label>
        <input type="password" name="password" required class="form-control" placeholder="••••••">
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px; font-size: 1.1em;">Intră în cont</button>
    </form>
    
    <p style="margin-top: 20px;">
        Nu ai cont? <a href="{{ url_for('register') }}">Creează unul aici</a>
    </p>
</div>
{% endblock %}
