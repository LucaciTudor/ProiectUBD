{% extends "base.html" %}
{% block title %}Înregistrare{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h1>📝 Creare Cont</h1>
    
    <form method="POST" style="background: #f8f9fa; padding: 30px; border-radius: 8px; border: 1px solid #ddd;">
        <div class="form-group">
            <label style="text-align: left;">Username:</label>
            <input type="text" name="username" required placeholder="Alege un utilizator">
        </div>
        <div class="form-group">
            <label style="text-align: left;">Parolă:</label>
            <input type="password" name="password" required placeholder="Alege o parolă">
        </div>
        <div class="form-group">
            <label style="text-align: left;">Confirmă Parola:</label>
            <input type="password" name="password_confirm" required placeholder="Repetă parola">
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 10px;">Creează Cont</button>
    </form>
    
    <p style="margin-top: 20px;">
        Ai deja cont? <a href="{{ url_for('login') }}">Loghează-te aici</a>
    </p>
</div>
{% endblock %}
