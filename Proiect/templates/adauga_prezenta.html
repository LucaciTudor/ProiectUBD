{% extends "base.html" %}
{% block title %}Adaugă Prezență{% endblock %}

{% block content %}
    <h1>⏱️ Adaugă Prezență</h1>
    <form method="POST" style="max-width: 500px;">
        <div class="form-group">
            <label>Student:</label>
            <select name="id_student" required>
                <option value="">-- Alege Student --</option>
                {% for s in studenti %}
                    <option value="{{ s.id_student }}">{{ s.get_full_name() }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Disciplină:</label>
            <select name="id_disciplina" required>
                <option value="">-- Alege Disciplină --</option>
                {% for d in discipline %}
                    <option value="{{ d.id_disciplina }}">{{ d.nume_disciplina }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Status:</label>
            <select name="status">
                <option value="prezent">🟢 Prezent</option>
                <option value="absent">🔴 Absent</option>
            </select>
        </div>
        <button type="submit" class="btn" style="background-color: #17a2b8; color: white;">Înregistrează Prezența</button>
    </form>
{% endblock %}
