{% extends "base.html" %}
{% block title %}Adaugă Profesor{% endblock %}

{% block content %}
    <h1>👨‍🏫 Adaugă Profesor</h1>
    <form method="POST" style="max-width: 500px;">
        <div class="form-group"><label>Nume:</label><input type="text" name="nume" required></div>
        <div class="form-group"><label>Prenume:</label><input type="text" name="prenume" required></div>
        <button type="submit" class="btn btn-success">💾 Salvează</button>
        <a href="{{ url_for('lista_profesori') }}" class="btn" style="background-color: gray;">Anulează</a>
    </form>
{% endblock %}
