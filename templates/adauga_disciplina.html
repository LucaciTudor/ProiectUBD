{% extends "base.html" %}
{% block title %}Adaugă Disciplină{% endblock %}

{% block content %}
    <h1>📚 Adaugă Disciplină</h1>
    <form method="POST" style="max-width: 500px;">
        <div class="form-group">
            <label>Nume Disciplină:</label>
            <input type="text" name="nume_disciplina" required>
        </div>
        <div class="form-group">
            <label>Număr Credite:</label>
            <input type="number" name="credite" min="1" required>
        </div>
        <div class="form-group">
            <label>Profesor Titular:</label>
            <select name="id_profesor_predare">
                <option value="">-- Selectează un profesor (Opțional) --</option>
                {% for prof in profesori %}
                    <option value="{{ prof.id_profesor }}">{{ prof.get_full_name() }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">💾 Salvează Disciplina</button>
    </form>
{% endblock %}
